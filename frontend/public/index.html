<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Directory</title>
  <!-- React & Babel via CDN - NO npm needed -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
    input, select, button { font-family: 'Inter', sans-serif; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 20px; text-align: left; font-size: 12px; font-weight: 700;
         color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;
         background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
    td { padding: 14px 20px; font-size: 14px; color: #334155; border-bottom: 1px solid #f8fafc; }
    tr:hover td { background: #f8fafc; }
    input:focus, select:focus { outline: none; border-color: #6366f1 !important; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .toast { animation: slideUp 0.3s ease; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const API = '/api/students';

// ── API helpers ────────────────────────────────────────────────
async function apiFetch(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

const DEPTS = ['Computer Science','Mathematics','Physics','Chemistry','Biology','Engineering'];
const DEPT_COLOR = {
  'Computer Science':'#6366f1','Mathematics':'#8b5cf6','Physics':'#ec4899',
  'Chemistry':'#f59e0b','Biology':'#10b981','Engineering':'#3b82f6'
};
const YEAR_LABEL = {1:'Year 1',2:'Year 2',3:'Year 3',4:'Year 4'};

function getColor(dept) { return DEPT_COLOR[dept] || '#6366f1'; }
function initials(name) { return name?.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }

// ── Toast ──────────────────────────────────────────────────────
function Toast({ msg, type }) {
  if (!msg) return null;
  return (
    <div className="toast" style={{
      position:'fixed',bottom:24,right:24,padding:'14px 20px',
      borderRadius:10,color:'#fff',fontSize:14,fontWeight:500,zIndex:9999,
      background: type==='error'?'#ef4444':'#10b981',
      boxShadow:'0 4px 20px rgba(0,0,0,0.2)',display:'flex',alignItems:'center',gap:8
    }}>
      {type==='error'?'❌':'✅'} {msg}
    </div>
  );
}

// ── Navbar ─────────────────────────────────────────────────────
function Navbar({ total }) {
  return (
    <nav style={{background:'linear-gradient(135deg,#6366f1,#8b5cf6)',padding:'0 32px',
      display:'flex',alignItems:'center',justifyContent:'space-between',height:64,
      boxShadow:'0 4px 20px rgba(99,102,241,0.3)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:26}}>🎓</span>
        <div>
          <div style={{fontSize:20,fontWeight:700,color:'#fff'}}>Student Directory</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,0.7)'}}>Manage student records</div>
        </div>
      </div>
      <span style={{background:'rgba(255,255,255,0.2)',color:'#fff',
        padding:'4px 14px',borderRadius:20,fontSize:13,fontWeight:600}}>
        {total} Students
      </span>
    </nav>
  );
}

// ── Dashboard Stats ────────────────────────────────────────────
function Dashboard({ stats }) {
  if (!stats) return null;
  const maxDept = Math.max(...(stats.byDepartment?.map(d=>+d.count)||[1]));
  const COLORS = ['#6366f1','#8b5cf6','#ec4899','#f59e0b','#10b981','#3b82f6'];

  return (
    <div>
      {/* Stat cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:20,marginBottom:28}}>
        {[
          {icon:'🎓',label:'Total Students',val:stats.total,sub:'Registered',bg:'#e0e7ff'},
          {icon:'🏫',label:'Departments',val:stats.byDepartment?.length||0,sub:'Active',bg:'#fce7f3'},
          ...(stats.byYear||[]).map(y=>({
            icon:['','1️⃣','2️⃣','3️⃣','4️⃣'][y.year],
            label:YEAR_LABEL[y.year]||`Year ${y.year}`,val:y.count,sub:'students',bg:'#d1fae5'
          }))
        ].map((c,i)=>(
          <div key={i} style={{background:'#fff',borderRadius:12,padding:24,
            boxShadow:'0 2px 8px rgba(0,0,0,0.06)',display:'flex',alignItems:'center',gap:16}}>
            <div style={{width:52,height:52,borderRadius:12,background:c.bg,
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}}>
              {c.icon}
            </div>
            <div>
              <div style={{fontSize:13,color:'#64748b',fontWeight:500}}>{c.label}</div>
              <div style={{fontSize:28,fontWeight:700,color:'#1e293b',lineHeight:1}}>{c.val}</div>
              <div style={{fontSize:12,color:'#94a3b8'}}>{c.sub}</div>
            </div>
          </div>
        ))}
      </div>

      {/* Dept breakdown */}
      {stats.byDepartment?.length > 0 && (
        <>
          <div style={{fontSize:15,fontWeight:700,color:'#1e293b',marginBottom:12}}>📊 By Department</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(170px,1fr))',gap:12,marginBottom:28}}>
            {stats.byDepartment.map((d,i)=>(
              <div key={d.department} style={{background:'#fff',borderRadius:10,padding:16,
                boxShadow:'0 2px 8px rgba(0,0,0,0.06)'}}>
                <div style={{fontSize:13,color:'#64748b',fontWeight:500,marginBottom:6}}>
                  {d.department||'Unassigned'}
                </div>
                <div style={{fontSize:22,fontWeight:700,color:COLORS[i%COLORS.length]}}>{d.count}</div>
                <div style={{height:4,background:'#e2e8f0',borderRadius:4,marginTop:8}}>
                  <div style={{height:'100%',borderRadius:4,
                    background:COLORS[i%COLORS.length],
                    width:`${(+d.count/maxDept)*100}%`}}/>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── Delete Modal ───────────────────────────────────────────────
function DeleteModal({ student, onClose, onConfirm }) {
  const [loading, setLoading] = useState(false);
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',
      display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}>
      <div style={{background:'#fff',borderRadius:12,padding:32,maxWidth:400,width:'100%',
        boxShadow:'0 20px 60px rgba(0,0,0,0.2)',textAlign:'center',animation:'fadeIn 0.2s ease'}}>
        <div style={{fontSize:48,marginBottom:16}}>🗑️</div>
        <h2 style={{fontSize:20,fontWeight:700,color:'#1e293b',marginBottom:8}}>Delete Student</h2>
        <p style={{fontSize:14,color:'#64748b',marginBottom:28}}>
          Are you sure you want to delete <strong style={{color:'#ef4444'}}>{student?.name}</strong>?<br/>
          This action cannot be undone.
        </p>
        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          <button onClick={onClose} style={{padding:'10px 24px',border:'1.5px solid #e2e8f0',
            borderRadius:8,background:'#fff',color:'#64748b',fontSize:14,fontWeight:500,cursor:'pointer'}}>
            Cancel
          </button>
          <button onClick={async()=>{setLoading(true);await onConfirm();setLoading(false);}}
            style={{padding:'10px 24px',border:'none',borderRadius:8,background:'#ef4444',
              color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer'}}>
            {loading?'Deleting...':'Yes, Delete'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Student Form ───────────────────────────────────────────────
function StudentForm({ student, onClose, onSave }) {
  const [form, setForm] = useState({
    name:student?.name||'', email:student?.email||'',
    phone:student?.phone||'', department:student?.department||'', year:student?.year||''
  });
  const [errors, setErrors] = useState({});
  const [loading, setLoading] = useState(false);

  const validate = () => {
    const e = {};
    if (!form.name.trim()) e.name='Name is required';
    if (!form.email.trim()) e.email='Email is required';
    else if (!/\S+@\S+\.\S+/.test(form.email)) e.email='Invalid email';
    setErrors(e);
    return !Object.keys(e).length;
  };

  const inp = { width:'100%', padding:'10px 14px', border:'1.5px solid #e2e8f0',
    borderRadius:8, fontSize:14, color:'#1e293b', background:'#f8fafc' };

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',
      display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000,padding:16}}>
      <div style={{background:'#fff',borderRadius:12,padding:32,maxWidth:480,width:'100%',
        boxShadow:'0 20px 60px rgba(0,0,0,0.2)',animation:'fadeIn 0.2s ease'}}>
        <h2 style={{fontSize:20,fontWeight:700,color:'#1e293b',marginBottom:24}}>
          {student?'✏️ Edit Student':'➕ Add New Student'}
        </h2>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
          <div style={{gridColumn:'1/-1'}}>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Full Name *</label>
            <input style={{...inp,borderColor:errors.name?'#ef4444':'#e2e8f0'}}
              value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Alice Johnson"/>
            {errors.name&&<p style={{color:'#ef4444',fontSize:12,marginTop:4}}>{errors.name}</p>}
          </div>
          <div style={{gridColumn:'1/-1'}}>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Email *</label>
            <input style={{...inp,borderColor:errors.email?'#ef4444':'#e2e8f0'}}
              type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="alice@example.com"/>
            {errors.email&&<p style={{color:'#ef4444',fontSize:12,marginTop:4}}>{errors.email}</p>}
          </div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Phone</label>
            <input style={inp} value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="555-0101"/>
          </div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Year</label>
            <select style={inp} value={form.year} onChange={e=>setForm({...form,year:e.target.value})}>
              <option value="">Select year</option>
              {[1,2,3,4].map(y=><option key={y} value={y}>Year {y}</option>)}
            </select>
          </div>
          <div style={{gridColumn:'1/-1'}}>
            <label style={{fontSize:13,fontWeight:600,color:'#475569',display:'block',marginBottom:6}}>Department</label>
            <select style={inp} value={form.department} onChange={e=>setForm({...form,department:e.target.value})}>
              <option value="">Select department</option>
              {DEPTS.map(d=><option key={d} value={d}>{d}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:'flex',gap:12,marginTop:28,justifyContent:'flex-end'}}>
          <button onClick={onClose} style={{padding:'10px 20px',border:'1.5px solid #e2e8f0',
            borderRadius:8,background:'#fff',color:'#64748b',fontSize:14,cursor:'pointer'}}>Cancel</button>
          <button onClick={async()=>{
              if(!validate())return; setLoading(true);
              try{await onSave({...form,year:form.year?+form.year:null});}finally{setLoading(false);}
            }}
            style={{padding:'10px 24px',border:'none',borderRadius:8,
              background:'linear-gradient(135deg,#6366f1,#8b5cf6)',color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer'}}>
            {loading?'Saving...':(student?'Update Student':'Add Student')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Student List ───────────────────────────────────────────────
function StudentList({ students, onAdd, onEdit, onDelete, loading }) {
  const [search, setSearch] = useState('');
  const [fDept, setFDept]   = useState('');
  const [fYear, setFYear]   = useState('');

  const filtered = students.filter(s => {
    const ms = !search || s.name.toLowerCase().includes(search.toLowerCase()) || s.email.toLowerCase().includes(search.toLowerCase());
    return ms && (!fDept||s.department===fDept) && (!fYear||String(s.year)===fYear);
  });

  const inp = {padding:'10px 14px',border:'1.5px solid #e2e8f0',borderRadius:8,
    fontSize:14,color:'#1e293b',background:'#f8fafc',outline:'none'};

  return (
    <div style={{background:'#fff',borderRadius:12,boxShadow:'0 2px 8px rgba(0,0,0,0.06)',overflow:'hidden'}}>
      {/* Toolbar */}
      <div style={{padding:'20px 24px',borderBottom:'1px solid #f1f5f9',
        display:'flex',gap:12,alignItems:'center',flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:1,minWidth:200}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',fontSize:16}}>🔍</span>
          <input style={{...inp,width:'100%',paddingLeft:36}} placeholder="Search by name or email..."
            value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <select style={inp} value={fDept} onChange={e=>setFDept(e.target.value)}>
          <option value="">All Departments</option>
          {DEPTS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <select style={inp} value={fYear} onChange={e=>setFYear(e.target.value)}>
          <option value="">All Years</option>
          {[1,2,3,4].map(y=><option key={y} value={y}>Year {y}</option>)}
        </select>
        <button onClick={onAdd} style={{padding:'10px 20px',border:'none',borderRadius:8,
          background:'linear-gradient(135deg,#6366f1,#8b5cf6)',color:'#fff',
          fontSize:14,fontWeight:600,cursor:'pointer',whiteSpace:'nowrap'}}>
          + Add Student
        </button>
      </div>

      {/* Table */}
      {loading ? (
        <div style={{textAlign:'center',padding:60,color:'#94a3b8'}}>
          <div style={{fontSize:40,marginBottom:12}}>⏳</div>
          <div style={{fontSize:16,fontWeight:600}}>Loading students...</div>
        </div>
      ) : filtered.length === 0 ? (
        <div style={{textAlign:'center',padding:60,color:'#94a3b8'}}>
          <div style={{fontSize:48,marginBottom:12}}>🎓</div>
          <div style={{fontSize:16,fontWeight:600,color:'#64748b',marginBottom:4}}>No students found</div>
          <div>Try adjusting your filters</div>
        </div>
      ) : (
        <div style={{overflowX:'auto'}}>
          <table>
            <thead>
              <tr>
                <th>Student</th><th>Phone</th><th>Department</th><th>Year</th><th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((s,i)=>{
                const color = getColor(s.department);
                return (
                  <tr key={s.id}>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <div style={{width:36,height:36,borderRadius:'50%',background:color,
                          display:'flex',alignItems:'center',justifyContent:'center',
                          color:'#fff',fontWeight:700,fontSize:14,flexShrink:0}}>
                          {initials(s.name)}
                        </div>
                        <div>
                          <div style={{fontWeight:600,color:'#1e293b'}}>{s.name}</div>
                          <div style={{fontSize:12,color:'#94a3b8'}}>{s.email}</div>
                        </div>
                      </div>
                    </td>
                    <td>{s.phone||'—'}</td>
                    <td>
                      {s.department
                        ? <span style={{padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:600,
                            background:`${color}18`,color}}>{s.department}</span>
                        : '—'}
                    </td>
                    <td>
                      {s.year
                        ? <span style={{padding:'3px 10px',borderRadius:20,fontSize:12,fontWeight:600,
                            background:'#f1f5f9',color:'#475569'}}>{YEAR_LABEL[s.year]}</span>
                        : '—'}
                    </td>
                    <td>
                      <button onClick={()=>onEdit(s)} style={{padding:'6px 14px',border:'1.5px solid #e2e8f0',
                        borderRadius:6,background:'#fff',color:'#6366f1',fontSize:13,fontWeight:500,
                        cursor:'pointer',marginRight:8}}>✏️ Edit</button>
                      <button onClick={()=>onDelete(s)} style={{padding:'6px 14px',border:'1.5px solid #fecaca',
                        borderRadius:6,background:'#fff',color:'#ef4444',fontSize:13,fontWeight:500,cursor:'pointer'}}>
                        🗑️ Delete</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <div style={{padding:'14px 24px',borderTop:'1px solid #f1f5f9',fontSize:13,color:'#94a3b8'}}>
        Showing {filtered.length} of {students.length} students
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────
function App() {
  const [students, setStudents] = useState([]);
  const [stats, setStats]       = useState(null);
  const [loading, setLoading]   = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [editSt, setEditSt]     = useState(null);
  const [delSt, setDelSt]       = useState(null);
  const [toast, setToast]       = useState({msg:'',type:'success'});

  const notify = (msg, type='success') => {
    setToast({msg,type});
    setTimeout(()=>setToast({msg:'',type:'success'}), 3000);
  };

  const fetchAll = useCallback(async () => {
    try {
      setLoading(true);
      const [data, st] = await Promise.all([
        apiFetch(API),
        apiFetch(`${API}/stats/summary`)
      ]);
      setStudents(data);
      setStats(st);
    } catch(e) {
      notify('Failed to load data','error');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(()=>{ fetchAll(); },[fetchAll]);

  const handleSave = async (data) => {
    try {
      if (editSt) {
        await apiFetch(`${API}/${editSt.id}`, {method:'PUT', body:JSON.stringify(data)});
        notify(`${data.name} updated!`);
      } else {
        await apiFetch(API, {method:'POST', body:JSON.stringify(data)});
        notify(`${data.name} added!`);
      }
      setShowForm(false); setEditSt(null); fetchAll();
    } catch(e) { notify(e.message,'error'); }
  };

  const handleDelete = async () => {
    try {
      await apiFetch(`${API}/${delSt.id}`, {method:'DELETE'});
      notify(`${delSt.name} deleted!`);
      setDelSt(null); fetchAll();
    } catch(e) { notify('Delete failed','error'); }
  };

  return (
    <div style={{minHeight:'100vh',background:'#f1f5f9'}}>
      <Navbar total={stats?.total||0}/>
      <main style={{maxWidth:1200,margin:'0 auto',padding:'32px 24px'}}>
        <div style={{fontSize:18,fontWeight:700,color:'#1e293b',marginBottom:16}}>📊 Overview</div>
        <Dashboard stats={stats}/>
        <div style={{fontSize:18,fontWeight:700,color:'#1e293b',marginBottom:16}}>🎓 Student Records</div>
        <StudentList
          students={students} loading={loading}
          onAdd={()=>{setEditSt(null);setShowForm(true);}}
          onEdit={s=>{setEditSt(s);setShowForm(true);}}
          onDelete={s=>setDelSt(s)}
        />
      </main>

      {showForm && (
        <StudentForm student={editSt}
          onClose={()=>{setShowForm(false);setEditSt(null);}}
          onSave={handleSave}/>
      )}
      {delSt && (
        <DeleteModal student={delSt}
          onClose={()=>setDelSt(null)}
          onConfirm={handleDelete}/>
      )}
      <Toast msg={toast.msg} type={toast.type}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
